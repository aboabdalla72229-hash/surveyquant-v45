name: Build SurveyQuant v1.0.45

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Project ZIP
        run: |
          echo "Checking project ZIP..."
          ls -lh
          test -f SurveyQuantAndroid_v1.0.45_JAVA_FIX.zip

      - name: Extract SurveyQuant Project
        run: |
          unzip -o SurveyQuantAndroid_v1.0.45_JAVA_FIX.zip
          cp -r SurveyQuantAndroid/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.45-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
